[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sportsbet-tool"
version = "0.1.0"
description = "Local sports and esports prediction, backtesting, bankroll, and safe bet-slip assistance tool."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Local Agent" }]
dependencies = []

[project.optional-dependencies]
ml = ["scikit-learn>=1.4", "pandas>=2.0"]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=8.0"]

[project.scripts]
sportsbet-tool = "sportsbet_tool.cli:main"

[tool.setuptools.packages.find]
include = ["sportsbet_tool*"]
